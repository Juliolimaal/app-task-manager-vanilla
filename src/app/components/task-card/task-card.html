<div class="rounded border bg-white p-3 shadow-sm">
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-3">
      <span class="size-3.5 rounded-full" [class]="dueColor()" title="Proximidade"></span>
      <div>
        <div class="font-semibold text-slate-800">{{ task().title }}</div>
        <div class="text-xs text-slate-500">Término: {{ task().due }} • {{ levelLabel() }}</div>
      </div>
    </div>
    <button
      type="button"
      (click)="delete.emit(task().id)"
      class="text-xs text-red-500 hover:text-red-700">
      Excluir
    </button>
  </div>
  @if (task().desc) {
    <p class="mt-2 text-sm text-slate-600">{{ task().desc }}</p>
  }
</div>
